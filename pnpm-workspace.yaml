packages:
  - apps/*
  - packages/*

# Sandbox packages are workspace members but remain outside production manifests.

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  fast-uri@>=4.0.0 <4.1.2: 4.1.2
