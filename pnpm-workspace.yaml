packages:
  - apps/*
  - packages/*

# Sandbox packages are workspace members but remain outside production manifests.

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.3
  "@grpc/grpc-js@>=1.14.0 <1.14.5": 1.14.5
  "brace-expansion@>=1.0.0 <1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
  "esbuild@<0.28.1": 0.28.1
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  "source-map-js@<1.2.2": 1.2.2
  "undici@>=5.0.0 <6.0.0": 6.29.1
  "uuid@>=10.0.0 <11.0.0": 11.1.1

minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1001.6"
  - "@aws-sdk/client-s3@3.1157.0"
  - "@aws-sdk/core@3.978.6"
  - "@aws-sdk/credential-provider-env@3.972.77"
  - "@aws-sdk/credential-provider-http@3.972.79"
  - "@aws-sdk/credential-provider-ini@3.973.22"
  - "@aws-sdk/credential-provider-login@3.972.84"
  - "@aws-sdk/credential-provider-node@3.972.89"
  - "@aws-sdk/credential-provider-process@3.972.77"
  - "@aws-sdk/credential-provider-sso@3.973.21"
  - "@aws-sdk/credential-provider-web-identity@3.972.83"
  - "@aws-sdk/middleware-sdk-s3@3.972.82"
  - "@aws-sdk/nested-clients@3.997.51"
  - "@aws-sdk/s3-request-presigner@3.1157.0"
  - "@aws-sdk/token-providers@3.1157.0"
  - "@smithy/core@3.37.0"
  - "@smithy/node-http-handler@4.13.0"
