packages:
  - apps/*
  - packages/*

# Sandbox packages are workspace members but remain outside production manifests.

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  fast-uri@>=3.0.0 <3.1.8: 3.1.8
  fast-uri@>=4.0.0 <4.1.5: 4.1.5
  "@grpc/grpc-js@>=1.14.0 <1.14.5": 1.14.5
