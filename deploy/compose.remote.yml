name: ii-tonya-${DEPLOY_ENVIRONMENT:?DEPLOY_ENVIRONMENT is required}

services:
  migrate:
    image: ${API_IMAGE_REF:?API_IMAGE_REF is required}
    env_file:
      - ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    command:
      - node
      - --input-type=module
      - --eval
      - >-
        import { closeDb, createDb, defaultMigrationsFolder, migrateDb } from '@ii-tonya/db';
        const db=createDb(process.env.DATABASE_URL);
        try { await migrateDb(db, defaultMigrationsFolder); } finally { await closeDb(db); }
    restart: "no"

  api:
    image: ${API_IMAGE_REF:?API_IMAGE_REF is required}
    env_file:
      - ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - ${API_BIND_ADDRESS:-127.0.0.1}:${API_BIND_PORT:-3000}:3000
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "--eval",
          "const r=await fetch('http://127.0.0.1:3000/health/ready');if(!r.ok)process.exit(1)",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 24

  worker:
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF is required}
    env_file:
      - ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "--eval",
          "const s=(await import('node:fs/promises')).stat;try{const m=(await s('/tmp/ii-tonya-worker-heartbeat')).mtimeMs;if(Date.now()-m>30000)process.exit(1)}catch{process.exit(1)}",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 24

networks:
  backend:
    driver: bridge
