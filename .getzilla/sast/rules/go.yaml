rules:
  - id: getzilla.go.sql-injection
    mode: taint
    languages: [go]
    severity: ERROR
    message: Request data is formatted into a SQL string. Use placeholders and pass values as arguments.
    metadata: {cwe: "CWE-89", owasp: "A03:2021", confidence: MEDIUM}
    pattern-sources: &go-sources
      - pattern-either:
          - pattern: $R.URL.Query().Get(...)
          - pattern: $R.URL.Query()
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: $R.Header.Get(...)
          - pattern: ($C *gin.Context).Query(...)
          - pattern: ($C *gin.Context).Param(...)
          - pattern: os.Args
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($Q, ...)
              - pattern: $DB.QueryRow($Q, ...)
              - pattern: $DB.Exec($Q, ...)
              - pattern: $DB.QueryContext($CTX, $Q, ...)
              - pattern: $DB.ExecContext($CTX, $Q, ...)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
  - id: getzilla.go.command-injection
    mode: taint
    languages: [go]
    severity: ERROR
    message: Request data reaches a shell command line. Run the program directly with separate arguments.
    metadata: {cwe: "CWE-78", owasp: "A03:2021", confidence: MEDIUM}
    pattern-sources: *go-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec.Command("sh", "-c", $C)
              - pattern: exec.Command("bash", "-c", $C)
              - pattern: exec.CommandContext($CTX, "sh", "-c", $C)
              - pattern: exec.CommandContext($CTX, "bash", "-c", $C)
          - focus-metavariable: $C
  - id: getzilla.go.ssrf
    mode: taint
    languages: [go]
    severity: WARNING
    message: Request data chooses the URL of a server-side request. Allow-list hosts before fetching.
    metadata: {cwe: "CWE-918", owasp: "A10:2021", confidence: MEDIUM}
    pattern-sources: *go-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Get($U)
              - pattern: http.Post($U, ...)
              - pattern: http.NewRequest($M, $U, ...)
              - pattern: http.NewRequestWithContext($CTX, $M, $U, ...)
          - focus-metavariable: $U
