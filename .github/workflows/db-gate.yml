name: Database Gate

on:
  push:
    branches:
      - main
      - agent/production-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-schema:
    name: PostgreSQL migration and schema invariants
    if: github.event_name != 'pull_request' || (github.repository_owner == 'Dimkox' && github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, linux, x64, claw, ii-tonya-test]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Run isolated Claw database gate
        run: bash scripts/run-claw-actions-job.sh database

      - name: Record Docker diagnostics on failure
        if: failure()
        run: |
          docker version
          docker ps --all
