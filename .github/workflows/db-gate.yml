name: Database Gate

on:
  push:
    branches:
      - main
      - agent/production-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-schema:
    name: PostgreSQL migration and schema invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.9.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build dist-only workspace packages
        run: pnpm build

      - name: Validate Drizzle metadata
        run: pnpm exec drizzle-kit check --config packages/db/drizzle.config.ts

      - name: Run PostgreSQL schema integration gate
        run: pnpm exec vitest run tests/integration/schema.test.ts

      - name: Run expert residency schema parity gate
        run: pnpm exec vitest run tests/repo/db-schema-parity.test.ts tests/integration/expert-referral-schema.test.ts tests/integration/expert-referral-migration-upgrade.test.ts

      - name: Run webhook inbox ownership and retry gate
        run: pnpm exec vitest run tests/integration/webhook-inbox.test.ts

      - name: Run verified catalog integration gate
        run: pnpm exec vitest run tests/integration/catalog-repository.test.ts

      - name: Repeat message-ledger concurrency gate
        run: pnpm test:repeat -- 20 tests/integration/message-ledger-concurrency.test.ts

      - name: Run feedback transaction gate
        run: pnpm exec vitest run tests/integration/feedback-transaction.test.ts

      - name: Run admin approval IAM gate
        run: pnpm exec vitest run tests/integration/admin-approval.test.ts

      - name: Run atomic admin workflow gate
        run: pnpm exec vitest run tests/integration/admin-ledger.test.ts

      - name: Run AC-025 exact MVP chain gate
        run: pnpm exec vitest run tests/e2e/mvp-smoke.test.ts

      - name: Run authenticated admin API gate
        run: pnpm exec vitest run tests/integration/admin-api.test.ts

      - name: Repeat atomic conversation completion gate
        run: pnpm test:repeat -- 20 tests/integration/conversation-message-repository.test.ts

      - name: Repeat booking concurrency gate
        run: pnpm test:repeat -- 20 tests/integration/booking-concurrency.test.ts

      - name: Repeat durable outbox gate
        run: pnpm test:repeat -- 20 tests/integration/outbox-runner.test.ts tests/integration/outbox-repository.test.ts

      - name: Repeat Telegram callback gate
        run: pnpm test:repeat -- 20 tests/integration/telegram-callback-migration.test.ts tests/integration/telegram-callback-repository.test.ts

      - name: Repeat expert referral redemption concurrency gate
        run: pnpm test:repeat -- 20 tests/integration/expert-referral-redemption-concurrency.test.ts

      - name: Repeat expert residency checkout concurrency gate
        run: pnpm test:repeat -- 20 tests/integration/expert-residency-checkout-concurrency.test.ts

      - name: Repeat expert residency settlement concurrency gate
        run: pnpm test:repeat -- 20 tests/integration/expert-residency-settlement-concurrency.test.ts

      - name: Repeat expert residency deadline gate
        run: pnpm test:repeat -- 20 tests/integration/expert-residency-deadline.test.ts

      - name: Repeat expert residency held-reward gate
        run: pnpm test:repeat -- 20 tests/integration/expert-residency-hold-replay.test.ts

      - name: Record Docker diagnostics on failure
        if: failure()
        run: |
          docker version
          docker ps --all