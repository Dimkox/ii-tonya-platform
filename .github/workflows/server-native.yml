name: Legacy native deploy disabled

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ii-tonya-disabled-native-server
  cancel-in-progress: false

jobs:
  legacy-disabled:
    runs-on: [self-hosted, linux, x64, claw, ii-tonya-release]
    timeout-minutes: 2
    steps:
      - name: Refuse the legacy deployment path
        run: |
          echo "::error::Legacy native deployment is disabled. Use the provenance-bound Gated release workflow."
          exit 1
