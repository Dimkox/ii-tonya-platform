name: Temporary server control

on:
  push:
    branches:
      - ops/server-control
    paths:
      - ops/server-command.sh

permissions:
  contents: write

concurrency:
  group: ii-tonya-server-control
  cancel-in-progress: false

jobs:
  command:
    runs-on: [self-hosted, linux, x64, ii-tonya-server]
    timeout-minutes: 30
    steps:
      - name: Checkout control branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ops/server-control
          fetch-depth: 1

      - name: Execute command
        id: execute
        shell: bash
        run: |
          set +e
          bash ops/server-command.sh > ops/server-command-output.txt 2>&1
          status=$?
          {
            printf '\n---\nexit_status=%s\n' "$status"
            printf 'host=%s\n' "$(hostname -f 2>/dev/null || hostname)"
            printf 'timestamp=%s\n' "$(date --iso-8601=seconds)"
          } >> ops/server-command-output.txt
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish command output
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ii-tonya-server-control'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/server-command-output.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ops: record server command result [skip ci]'
          git push origin HEAD:ops/server-control

      - name: Propagate command status
        shell: bash
        run: exit "${{ steps.execute.outputs.status }}"
