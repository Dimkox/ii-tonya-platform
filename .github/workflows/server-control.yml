name: Temporary server control

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ii-tonya-server-control
  cancel-in-progress: true

jobs:
  command:
    runs-on: [self-hosted, linux, x64, ii-tonya-server]
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1

      - name: Execute command
        id: execute
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/server-command-output.txt"
          bash ops/server-command.sh > "$output" 2>&1
          status=$?
          {
            printf '\n---\nexit_status=%s\n' "$status"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'host=%s\n' "$(hostname -f 2>/dev/null || hostname)"
            printf 'timestamp=%s\n' "$(date --iso-8601=seconds)"
          } >> "$output"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish command output to control branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/server-command-output.txt"
          test -f "$output" || printf 'server command produced no output\n' > "$output"

          content="$(base64 -w0 "$output")"
          path='ops/server-command-output.txt'
          branch='ops/server-control'
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" --jq .sha 2>/dev/null || true)"

          args=(
            --method PUT
            "repos/$GITHUB_REPOSITORY/contents/$path"
            -f message="ops: record server command result [skip ci]"
            -f content="$content"
            -f branch="$branch"
          )
          if test -n "$existing_sha"; then
            args+=(-f sha="$existing_sha")
          fi
          gh api "${args[@]}" >/dev/null

      - name: Propagate command status
        shell: bash
        run: exit "${{ steps.execute.outputs.status }}"
