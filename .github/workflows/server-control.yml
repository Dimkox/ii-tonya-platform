name: Temporary server control

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ii-tonya-server-control
  cancel-in-progress: true

jobs:
  command:
    runs-on: [self-hosted, linux, x64, ii-tonya-server]
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1

      - name: Execute command
        id: execute
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/server-command-output.txt"
          bash ops/server-command.sh > "$output" 2>&1
          status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish safe command status
        if: always()
        shell: bash
        env:
          COMMAND_STATUS: ${{ steps.execute.outputs.status }}
        run: |
          set -Eeuo pipefail
          {
            printf '## Server control result\n\n'
            printf -- "- exit status: \`%s\`\n" "$COMMAND_STATUS"
            printf -- '- run: [%s](https://github.com/%s/actions/runs/%s)\n' \
              "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\nRaw command output is not published because it may contain secrets.\n'
          } >> "$GITHUB_STEP_SUMMARY"
