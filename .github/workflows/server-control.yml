name: Temporary server control

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ii-tonya-server-control
  cancel-in-progress: false

jobs:
  command:
    if: github.event.issue.title == 'ops/server-control'
    runs-on: [self-hosted, linux, x64, ii-tonya-server]
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1

      - name: Execute command
        id: execute
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/server-command-output.txt"
          bash ops/server-command.sh > "$output" 2>&1
          status=$?
          {
            printf '\n---\nexit_status=%s\n' "$status"
            printf 'host=%s\n' "$(hostname -f 2>/dev/null || hostname)"
            printf 'timestamp=%s\n' "$(date --iso-8601=seconds)"
          } >> "$output"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish command output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/server-command-output.txt"
          comment="$RUNNER_TEMP/server-command-comment.md"
          {
            printf '```text\n'
            head -c 55000 "$output"
            printf '\n```\n'
          } > "$comment"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"

      - name: Propagate command status
        shell: bash
        run: exit "${{ steps.execute.outputs.status }}"
