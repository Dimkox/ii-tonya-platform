name: Disabled legacy server control

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ii-tonya-server-control
  cancel-in-progress: true

jobs:
  legacy-disabled:
    runs-on: [self-hosted, linux, x64, claw, ii-tonya-release]
    timeout-minutes: 2

    steps:
      - name: Refuse the bypass path
        shell: bash
        run: |
          printf 'Legacy server control is disabled. Use the gated release workflow.\n' >&2
          exit 1
